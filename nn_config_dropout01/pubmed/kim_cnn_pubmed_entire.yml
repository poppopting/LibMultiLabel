# This config only serves as an example as it is not tuned by hyper-parameter search.
# data
training_file: data/pubmed/pubmed_raw_texts_train.txt
val_file: data/pubmed/pubmed_raw_texts_val.txt
test_file: data/pubmed/pubmed_raw_texts_test.txt
data_name: BCE-kim-cnn-pubmed-entire
min_vocab_freq: 1
max_seq_length: 500
# decide whether to use micromacro
micromacro: false

# train
seed: 1337
epochs: 15
batch_size: 16
optimizer: adam
learning_rate: 0.0003
weight_decay: 0
patience: 10
shuffle: true

# eval
eval_batch_size: 16
monitor_metrics: ['Macro-F1', 'Micro-F1'] #['Macro-F1', 'Micro-F1', 'P@1', 'P@5', 'RP@5', 'nDCG@5']
val_metric: 'Macro-F1' #RP@5

# model
model_name: KimCNN
init_weight: kaiming_uniform
network_config:
  embed_dropout: 0.2
  post_encoder_dropout: 0.4
  filter_sizes: [8]
  num_filter_per_size: 1024

# pretrained vocab / embeddings
embed_file: glove.6B.200d
